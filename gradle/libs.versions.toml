[versions]
# Project
project-version = "0.0.1"

# Platform
datafixerupper = "8.0.16"
jetbrains-annotations = "26.0.2-1"

# Common
caffeine = "3.2.3"

# Sparrow
sparrow-nbt = "0.24"
sparrow-redis-message-broker = "0.0.7"

# Storage
lettuce = "6.8.1.RELEASE"
netty = "4.2.7.Final"

[libraries]
# Platform
datafixerupper = { module = "com.mojang:datafixerupper", version.ref = "datafixerupper" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

# Common
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Sparrow
sparrow-nbt = { module = "net.momirealms:sparrow-nbt", version.ref = "sparrow-nbt" }
sparrow-nbt-codec = { module = "net.momirealms:sparrow-nbt-codec", version.ref = "sparrow-nbt" }
sparrow-redis-message-broker = { module = "net.momirealms:sparrow-redis-message-broker", version.ref = "sparrow-redis-message-broker" }

# Storage
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }

[bundles]
# Sparrow NBT
sparrow-nbt = [
    "sparrow-nbt",
    "sparrow-nbt-codec"
]
